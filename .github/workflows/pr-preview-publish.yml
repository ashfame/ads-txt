name: PR Preview - Publish

on:
  workflow_run:
    workflows: [PR Preview - Build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@v3
    with:
      artifacts-to-keep: '2'
      blueprint: |
        {
          "$schema": "https://playground.wordpress.net/blueprint-schema.json",
          "preferredVersions": {
            "php": "7.4",
            "wp": "latest"
          },
          "landingPage": "/wp-admin/options-general.php?page=adstxt-settings",
          "steps": [
            {
              "step": "installPlugin",
              "pluginData": {
                "resource": "url",
                "url": "{{ARTIFACT_URL:ads-txt}}"
              },
              "options": {
                "activate": true
              }
            }
          ]
        }
